<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Using TypeScript</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3>Crud Operation with TypeScript</h3>
        </div>

       <form action="" onsubmit="addUser(event)">
         <div class="card-body">

            <div class="mb-3">
                <label style="font-weight: bold;">Name</label>
                <input type="text" required id="name" class="form-control mt-2">
            </div>

            <div class="d-flex col-12">
                <div class="mb-3 col-6">
                <label style="font-weight: bold;">Email</label>
                <input type="email" required id="email" class="form-control mt-2">
            </div>

            <div class="mb-3 col-6 px-2">
                <label style="font-weight: bold;">Password</label>
                <input type="password" required id="password" class="form-control mt-2">
            </div>
            </div>

            <div class="mb-3">
                <label style="font-weight: bold;">City</label>
                <select id="city" class="form-select mt-2">
                    <option value="">Select City</option>
                    <option>Kolkata</option>
                    <option>Delhi</option>
                    <option>Mumbai</option>
                    <option>Chennai</option>
                    <option>Bangalore</option>
                </select>
            </div>

            <div class="mb-3">
                <label style="font-weight: bold;" class="mb-2">Gender</label><br>

                <input type="radio" name="gender" value="Male"> Male

                <input type="radio" name="gender" value="Female" class="ms-3"> Female

                <input type="radio" name="gender" value="Other" class="ms-3"> Other
            </div>

            <button type="submit" class="btn btn-primary">
                Add User
            </button>

        </div>
       </form>
    </div>

    <div class="card mt-4 shadow">

        <div class="card-header bg-dark text-white">
            <h3>User List</h3>
        </div>

        <div class="card-body">

            <div class="card mt-4 shadow user-list-card">

    <div class="card-header bg-dark text-white">
        <h3>User List</h3>
    </div>

    <div class="card-body">

        <div class="table-wrapper">

            <table class="table table-bordered table-hover">

                <thead class="table-secondary text-center">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Password</th>
                        <th>City</th>
                        <th>Gender</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="userTable" class="text-center"></tbody>

            </table>

        </div>

    </div>
</div>

        </div>

    </div>

</div>

<script type="module" src="./dist/crudIndex.js"></script>

</body>
</html>
